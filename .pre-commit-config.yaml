default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# Generated / vendored files: keep them byte-identical.
#
# data/preserved/ and data/shared/ hold artifacts whose bytes are pinned by a
# sha256 in their manifest. A formatting hook that "fixes" a trailing newline changes the
# hash and makes `make check` fail against a manifest the same commit wrote —
# generated, hash-pinned output must never be rewritten in place.
#
# petri/examples/data/ is the same files, and it is the copy that is committed:
# git ignores the working data/ entirely. end-of-file-fixer appended a newline to
# a preserved params.json there, taking it from 43 bytes to 44 and breaking the
# sha256 its own manifest recorded.
#
# The `data/` prefix stays optional rather than being dropped, so the rule also
# covers an artifact somebody force-adds from their own working tree.
exclude: |
  (?x)^(
    \.renv/activate\.R|
    renv\.lock|
    (petri/examples/)?data/(preserved|shared)/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      - id: uv-lock

  # detect-private-key matches PEM and SSH headers only, so an API token walks
  # straight past it. A Gemini key reached origin/main this way: marimo used to
  # rewrite a tracked .marimo.toml whenever its AI settings change. The runtime
  # settings now live in pyproject.toml's [tool.marimo], which marimo only ever
  # reads, so those writes land in the user's own config. This hook stays as the
  # net. Keys belong in .env, which git ignores.
  - repo: local
    hooks:
      - id: no-api-keys
        name: no API keys in tracked files
        language: pygrep
        types: [text]
        entry: '(?i)(api[_-]?key|secret|passwd|password|token)[ \t]*[=:][ \t]*["''][A-Za-z0-9._\-]{16,}|AQ\.[A-Za-z0-9_\-]{20,}|AIza[0-9A-Za-z_\-]{30,}|sk-[A-Za-z0-9]{32,}|gh[pousr]_[A-Za-z0-9]{30,}'
