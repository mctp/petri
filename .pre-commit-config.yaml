default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# Generated / vendored files: keep them byte-identical.
#
# preserved/ and shared/ hold artifacts whose bytes are pinned by a sha256 in
# their manifest. A formatting hook that "fixes" a trailing newline changes the
# hash and makes `make check` fail against a manifest the same commit wrote —
# generated, hash-pinned output must never be rewritten in place.
exclude: |
  (?x)^(
    renv/activate\.R|
    renv\.lock|
    preserved/|
    shared/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      - id: uv-lock
