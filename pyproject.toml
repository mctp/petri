[project]
name = "petri"
version = "0.1.0"
description = "Template for data science projects: marimo notebooks paired with the pi coding agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # notebook runtime
    "marimo[recommended]>=0.17",
    # data
    "numpy>=2.2",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=19",
    "duckdb>=1.1",
    "scipy>=1.15",
    # plotting
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "plotly>=6.0",
    # R interop (requires a local R installation; see petri/docs/rpy2.md)
    "rpy2>=3.6",
    "openpyxl>=3.1.5",
    "fastexcel>=0.20.2",
    "google-genai>=2.14.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
 "pre-commit>=4.1",
 "pytest>=9.1.1",
]

# This project is a workspace for notebooks, not an installable package.
[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["**/__marimo__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "NPY", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "E402",   # marimo cells import where they need to
    "B018",   # a bare expression is a marimo cell output
    "F841",   # cell-local names are often outputs, not dead code
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
markers = ["slow: runs the real make targets in a subprocess"]
testpaths = ["petri/tests"]
# This is a workspace, not an installable package, so `import petri` needs the
# repo root on sys.path. The Makefile exports PYTHONPATH for notebook runs; this
# line is what makes a bare `uv run pytest` work too.
pythonpath = ["."]

# marimo reads this section and never writes to it, which is the whole point of
# keeping it here rather than in a tracked .marimo.toml: marimo rewrites that
# file whenever its settings change, and a key typed into the AI panel became a
# committed key. With no .marimo.toml in the repo, those writes land in the
# user's own config (~/.config/marimo/marimo.toml) instead.
#
# Only project settings belong here — everything below changes what the code
# does, not how the editor looks. Values here are overrides a contributor cannot
# change from the UI, so personal preferences (theme, font size, keymap) are
# deliberately absent and come from each person's user config.
[tool.marimo.runtime]
# Load-bearing: this is what puts the repo root on sys.path so `import petri`
# resolves in the editor. Paths resolve relative to this pyproject.toml.
pythonpath = ["."]
dotenv = [".env"]
# Notebooks here read real data; opening one should not start that work.
auto_instantiate = false
# An edit to scripts/ marks the cells built from it stale.
auto_reload = "lazy"
watcher_on_save = "lazy"
on_cell_change = "autorun"
reactive_tests = true
show_tracebacks = false
default_csv_encoding = "utf-8"
default_sql_output = "auto"
output_max_bytes = 8_000_000
std_stream_max_bytes = 1_000_000

[tool.marimo.package_management]
# What `ctx.packages.add(...)` shells out to during a pairing session.
manager = "uv"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
# ruff owns formatting; marimo's formatter would fight it on every save.
format_on_save = false

[tool.marimo.formatting]
line_length = 79

[tool.marimo.ai]
enabled = true
mode = "ask"
inline_tooltip = false

# No api_key field anywhere. marimo falls back to GEMINI_API_KEY or
# GOOGLE_API_KEY from the environment; `make nb` loads .env, which git ignores.
[tool.marimo.ai.models]
chat_model = "google/gemini-3.1-flash-lite"
edit_model = "google/gemini-3.5-flash"
