[project]
name = "marimo-pi"
version = "0.1.0"
description = "Template for data science projects: marimo notebooks paired with the pi coding agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # notebook runtime
    "marimo[recommended]>=0.17",
    # data
    "numpy>=2.2",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=19",
    "duckdb>=1.1",
    "scipy>=1.15",
    # plotting
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "plotly>=6.0",
    # R interop (requires a local R installation; see docs/rpy2.md)
    "rpy2>=3.6",
    "openpyxl>=3.1.5",
    "fastexcel>=0.20.2",
]

[dependency-groups]
dev = ["ruff>=0.9", "pre-commit>=4.1"]

# This project is a workspace for notebooks, not an installable package.
[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["**/__marimo__", "vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "NPY", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "E402",   # marimo cells import where they need to
    "B018",   # a bare expression is a marimo cell output
    "F841",   # cell-local names are often outputs, not dead code
]

[tool.ruff.format]
docstring-code-format = true
